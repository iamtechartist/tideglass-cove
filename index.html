<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d7e6e7"><title>Tideglass Cove</title><meta name="description" content="An intimate, living coastal miniature."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='19' fill='%232b777b'/%3E%3Cpath d='M10 37Q21 27 32 37T54 37M10 46Q21 36 32 46T54 46' fill='none' stroke='%23e9f3dc' stroke-width='4'/%3E%3Ccircle cx='39' cy='20' r='7' fill='%23ebc88e'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.webgpu.js","three/webgpu":"./vendor/three.webgpu.js","three/tsl":"./vendor/three.tsl.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><main id="world" aria-label="Interactive coastal diorama. Drag to orbit, scroll to zoom, click water for ripples, or click the camper to open its door."></main>
<div id="startup" role="status" aria-live="polite"><span class="spinner"></span><span id="startup-text">Opening cove</span></div>
<aside id="dock" aria-label="Scene controls"><div id="primary">
<div class="segmented" role="group" aria-label="Light"><button id="day" aria-pressed="true" title="Daylight (D)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Day</span></button><button id="dusk" aria-pressed="false" title="Dusk (D)"><svg viewBox="0 0 24 24"><path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z"/></svg><span>Dusk</span></button></div>
<div class="divider"></div><label class="tide-control" for="tide"><span>Tide</span><input id="tide" type="range" min="0" max="100" value="45" aria-label="Tide level"></label>
<div class="divider"></div><label class="select-wrap" title="Camera view"><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5v9l-9 5-9-5Z M3 8l9 5 9-5M12 13v9"/></svg><select id="view" aria-label="View"><option value="cove">Cove</option><option value="camp">Campsite</option><option value="reef">Underwater</option></select></label>
<button id="jump" title="Dolphin jump (J)" aria-label="Dolphin jump"><svg viewBox="0 0 24 24"><path d="M3 18q3-3 6 0t6 0t6 0M6 13q6-14 12-1M14 10l4 2 2-4"/></svg><span>Jump</span></button><button id="more" class="icon-button" aria-label="More controls" aria-expanded="false" title="More controls"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></button><button id="hide" class="icon-button" aria-label="Hide controls" title="Hide controls (H)"><svg viewBox="0 0 24 24"><path d="m4 4 16 16M9.5 9.5a3.5 3.5 0 0 0 5 5M6 6C3 8 2 12 2 12s4 7 10 7c2 0 4-1 6-3M10 5h2c6 0 10 7 10 7s-1 2-3 4"/></svg></button>
</div><div id="secondary" hidden><label>Breeze<input id="breeze" type="range" min="0" max="100" value="35" aria-label="Breeze strength"></label><label class="select-wrap">Quality<select id="quality" aria-label="Quality"><option value="auto">Auto</option><option value="high">High</option><option value="low">Light</option></select></label><button id="orbit" aria-pressed="false">Orbit</button><button id="pause" aria-pressed="false">Pause</button><button id="door" aria-pressed="false">Door</button></div></aside>
<button id="restore" class="icon-button" hidden aria-label="Show controls" title="Show controls (H)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></button>
<script type="module">performance.mark('cove-start');import('./js/main.js').catch(error=>{console.error(error);const panel=document.getElementById('startup');panel.className='error';panel.textContent='A scene file could not load. Please reload the cove.';const retry=document.createElement('button');retry.textContent='Reload';retry.onclick=()=>location.reload();panel.append(retry);});</script>
</body></html>
